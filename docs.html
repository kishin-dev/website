<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docs · Kishin</title>
<meta name="description" content="Documentation for every Kishin project.">
<meta name="theme-color" content="#0B0809">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/hljs-github-dark.min.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="docs" class="overflow-x-hidden">
<div id="site-header"></div>

<div class="relative mx-auto flex max-w-[92rem] gap-8 px-4 pt-16 sm:px-6">
  <!-- sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-80 -translate-x-full overflow-y-auto border-r border-white/5 bg-ink/95 px-5 pb-10 pt-20 backdrop-blur-xl transition lg:sticky lg:top-16 lg:z-0 lg:h-[calc(100vh-4rem)] lg:w-72 lg:shrink-0 lg:translate-x-0 lg:border-0 lg:bg-transparent lg:px-0 lg:pt-8 lg:backdrop-blur-none">
    <label for="projectSelect" class="text-[11px] font-bold uppercase tracking-[.25em] text-ash">Project</label>
    <div class="relative mt-2">
      <select id="projectSelect" class="w-full appearance-none rounded-xl border border-white/10 bg-panel px-4 py-2.5 pr-10 font-semibold text-bone outline-none focus:border-crimson"></select>
      <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-ash">▾</span>
    </div>
    <div class="relative mt-4">
      <input id="search" type="search" placeholder="Search the docs..." autocomplete="off"
        class="w-full rounded-xl border border-white/10 bg-panel px-4 py-2.5 pl-10 text-sm text-bone outline-none placeholder:text-ash/60 focus:border-crimson focus:ring-2 focus:ring-crimson/30">
      <svg class="pointer-events-none absolute left-3.5 top-1/2 size-4 -translate-y-1/2 text-ash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <kbd class="pointer-events-none absolute right-3 top-1/2 hidden -translate-y-1/2 rounded border border-white/10 px-1.5 text-[10px] text-ash lg:block">/</kbd>
    </div>
    <nav id="nav" class="mt-6 space-y-7 text-sm"></nav>
  </aside>
  <div id="scrim" class="fixed inset-0 z-30 hidden bg-black/60 lg:hidden"></div>

  <!-- article -->
  <main class="min-w-0 flex-1 pb-24 pt-8">
    <button id="navBtn" class="mb-6 inline-flex items-center gap-2 rounded-lg border border-white/10 bg-panel px-3 py-2 text-sm font-semibold lg:hidden">☰ Menu</button>
    <div id="crumbs" class="mb-3 flex flex-wrap items-center gap-2 text-xs font-bold uppercase tracking-[.2em] text-ash"></div>
    <article id="article" class="doc"></article>
    <div id="pager" class="mt-16 grid gap-4 border-t border-white/5 pt-8 sm:grid-cols-2"></div>
  </main>

  <!-- on this page -->
  <aside class="sticky top-16 hidden h-[calc(100vh-4rem)] w-56 shrink-0 overflow-y-auto pt-10 xl:block">
    <p class="text-[11px] font-bold uppercase tracking-[.25em] text-ash">On this page</p>
    <nav id="toc" class="mt-3 space-y-1 border-l border-white/10 text-sm"></nav>
  </aside>
</div>

<script src="assets/vendor/marked.min.js"></script>
<script src="assets/vendor/highlight.min.js"></script>
<script src="assets/vendor/hljs-yaml.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/docs.js"></script>
</body>
</html>
